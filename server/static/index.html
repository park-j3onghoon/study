<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Study Learning App</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <aside id="sidebar">
    <h2>학습지</h2>
    <ul id="lesson-list"></ul>
  </aside>

  <main id="lesson-view">
    <button id="focus-toggle" type="button" title="집중 모드 (f 토글 / Esc 해제)" aria-pressed="false">📖</button>
    <div id="lesson-empty">
      좌측에서 학습지를 선택하거나, 하단 채팅에 <strong>"X 공부할래"</strong> 같이 입력하세요.
    </div>
    <iframe id="lesson-frame" sandbox="allow-scripts allow-same-origin allow-forms" style="display:none"></iframe>
  </main>

  <div id="chat-resizer" title="드래그하여 채팅 높이 조절"></div>

  <aside id="chat-panel">
    <header>
      <h2>채팅</h2>
      <label>
        모델
        <select id="model-select">
          <option value="claude-opus-4-7">Opus 4.7</option>
          <option value="claude-sonnet-4-6">Sonnet 4.6</option>
          <option value="claude-haiku-4-5-20251001">Haiku 4.5</option>
        </select>
      </label>
      <!-- thinking 은 백엔드에서 항상 effort=max 로 고정 (드롭다운 제거) -->
      <button id="distill-today" type="button" title="오늘 Claude 세션에서 배운 걸 학습지로 정리">🗓 오늘 학습 정리</button>
    </header>
    <div id="chat-messages"></div>
    <form id="chat-form">
      <textarea id="chat-input" placeholder="메시지... (예: 'AIP-134 공부할래')" rows="3"></textarea>
      <button type="submit">보내기</button>
    </form>
  </aside>

  <!-- 채팅 응답 렌더: marked(MD→HTML) + DOMPurify(주입 전 XSS 살균). 모듈은 defer
       되므로 이 클래식 스크립트가 먼저 실행돼 window.marked/DOMPurify 가 준비된다. -->
  <script src="https://cdn.jsdelivr.net/npm/marked@18/lib/marked.umd.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/dompurify@3/dist/purify.min.js"></script>
  <script type="module" src="/js/app.js"></script>
</body>
</html>
