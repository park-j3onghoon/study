<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Study Learning App</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <aside id="sidebar">
    <h2>학습지</h2>
    <ul id="lesson-list"></ul>
  </aside>

  <main id="lesson-view">
    <button id="focus-toggle" type="button" title="집중 모드 (f 토글 / Esc 해제)" aria-pressed="false">📖</button>
    <div id="lesson-empty">
      좌측에서 학습지를 선택하거나, 하단 채팅에 <strong>"X 공부할래"</strong> 같이 입력하세요.
    </div>
    <iframe id="lesson-frame" sandbox="allow-scripts allow-same-origin allow-forms" style="display:none"></iframe>
  </main>

  <aside id="chat-panel">
    <header>
      <h2>채팅</h2>
      <label>
        모델
        <select id="model-select">
          <option value="claude-opus-4-7">Opus 4.7</option>
          <option value="claude-sonnet-4-6">Sonnet 4.6</option>
          <option value="claude-haiku-4-5-20251001">Haiku 4.5</option>
        </select>
      </label>
      <label>
        thinking
        <select id="effort-select">
          <option value="0">Off</option>
          <option value="4000">Low</option>
          <option value="8000">Mid</option>
          <option value="16000" selected>High</option>
        </select>
      </label>
    </header>
    <div id="chat-messages"></div>
    <form id="chat-form">
      <textarea id="chat-input" placeholder="메시지... (예: 'AIP-134 공부할래')" rows="3"></textarea>
      <button type="submit">보내기</button>
    </form>
  </aside>

  <script type="module" src="/js/app.js"></script>
</body>
</html>
